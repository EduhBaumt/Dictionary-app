<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dictionary APP</title>
    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/5b4f27522e.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <audio id="sound"></audio>
    <div class="container" id="container">
      <div class="search-content">
        <input type="text" placeholder="Search for any word..." id="inp-text" />
        <button type="submit" id="inp-button">Search</button>
      </div>
      <div class="result" id="result">
        <div class="word" id="word">
          <h3>Sample</h3>
          <button><i class="fa-solid fa-volume"></i></button>
        </div>
        <div class="details" id="details">
          <p>pos</p>
          <p>/sample/</p>
        </div>
        <p class="word-meaning" id="word-meaning">
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Porro,
          molestias?
        </p>
        <p class="word-example" id="word-example">
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Autem,
          veritatis.
        </p>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
