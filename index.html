<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dictionary APP</title>
    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/5b4f27522e.js"
      crossorigin="anonymous"
    ></script>

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"
    />
  </head>
  <body>
    <div class="section">
      <h1 class="title">Dictionary app</h1>
      <div class="container" id="container">
        <form class="search-content" id="search-content">
          <input
            type="text"
            placeholder="Search for any word..."
            id="inp-text"
          />
          <button type="submit" id="inp-button">Search</button>
        </form>
        <div class="result" id="result"></div>
      </div>
    </div>
    <footer class="footer-container">
      <p class="footer-text">Made by: Eduh Baumt</p>
      <div class="footer-icons-content">
        <a
          class="footer-icon"
          href="https://www.linkedin.com/in/eduardo-baumart/"
          ><i class="devicon-linkedin-plain"></i
        ></a>

        <a class="footer-icon" href="https://github.com/EduhBaumt"
          ><i class="devicon-github-original"></i
        ></a>
      </div>
    </footer>
    <script src="main.js"></script>
  </body>
</html>
